[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ps2avrgb-native"
version = "0.2.0"
description = "Native ps2avrGB keyboard backup, keymap editing and verified programming"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["hidapi>=0.14", "PySide6>=6.8"]

[project.scripts]
ps2avrgb = "ps2avrgb.cli:main"

[tool.setuptools.packages.find]
include = ["ps2avrgb*"]

# Lint/format: `ruff check .` and `ruff format --check .` (see README "Verification").
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "D"]
# RUF005: picker rows such as ["Tab"] + list("QWERTYUIOP") + [...] read like the
# physical keyboard and are clearer than unpacking.
ignore = ["RUF005"]
# The GUI shows matrix size as "15 × 8"; the multiplication sign is intended.
allowed-confusables = ["×"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Docstrings are required for the application package; tests and one-off
# hardware research scripts are documented by their module docstrings.
"tests/*" = ["D"]
"research/*" = ["D", "SIM105"]
